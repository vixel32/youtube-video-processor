name: Process YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL YouTube"
        required: true
        type: string

  repository_dispatch:
    types: [process_video]

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          mkdir -p "$HOME/.local/bin"

          curl -L \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o "$HOME/.local/bin/yt-dlp"

          chmod a+rx "$HOME/.local/bin/yt-dlp"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check tools
        run: |
          yt-dlp --version
          deno --version
          ffmpeg -version | head -1

      - name: Get YouTube URL
        id: video
        run: |
          if [ -n "${{ inputs.video_url }}" ]; then
            echo "url=${{ inputs.video_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ github.event.client_payload.video_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download YouTube video
        run: |
          yt-dlp \
            --js-runtimes deno \
            --remote-components ejs:github \
            --format "best[ext=mp4]/best" \
            --merge-output-format mp4 \
            --output "video.mp4" \
            "${{ steps.video.outputs.url }}"

      - name: Get video duration
        id: duration
        run: |
          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            video.mp4)

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"

      - name: Create 4 square images
        run: |
          DURATION="${{ steps.duration.outputs.duration }}"

          FRAME1=$(python3 -c "print(float('$DURATION') * 0.25)")
          FRAME2=$(python3 -c "print(float('$DURATION') * 0.50)")
          FRAME3=$(python3 -c "print(float('$DURATION') * 0.75)")

          ffmpeg -y -ss 0 -i video.mp4 \
            -frames:v 1 \
            -vf "scale=1080:1080:force_original_aspect_ratio=increase,crop=1080:1080" \
            thumbnail.jpg

          ffmpeg -y -ss "$FRAME1" -i video.mp4 \
            -frames:v 1 \
            -vf "scale=1080:1080:force_original_aspect_ratio=increase,crop=1080:1080" \
            frame1.jpg

          ffmpeg -y -ss "$FRAME2" -i video.mp4 \
            -frames:v 1 \
            -vf "scale=1080:1080:force_original_aspect_ratio=increase,crop=1080:1080" \
            frame2.jpg

          ffmpeg -y -ss "$FRAME3" -i video.mp4 \
            -frames:v 1 \
            -vf "scale=1080:1080:force_original_aspect_ratio=increase,crop=1080:1080" \
            frame3.jpg

      - name: Save images
        uses: actions/upload-artifact@v4
        with:
          name: product-images
          path: |
            thumbnail.jpg
            frame1.jpg
            frame2.jpg
            frame3.jpg
